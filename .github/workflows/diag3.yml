name: Diagnose build labels
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: instrument
        run: |
          sed -i 's/^\(\s*\)\$threw = \$true$/\1$threw = $true; Write-Host "FETCHERR $url :: $($_.Exception.GetType().FullName) :: $($_.Exception.Message) :: $($_.InvocationInfo.PositionMessage)"/' lib/VariantLabels.ps1
          sed -i 's/^\(\s*\)if (\$parsed.Count -gt 0) { \$labels = \$parsed }$/\1if ($parsed.Count -gt 0) { $labels = $parsed } else { Write-Host "ZERO $url len=$($html.Length) type=$($parsed.GetType().FullName) count=$($parsed.Count)" }/' lib/VariantLabels.ps1
          grep -n "FETCHERR\|ZERO" lib/VariantLabels.ps1
      - name: build to tmp
        shell: pwsh
        env:
          GDF_FEED_URL: ${{ secrets.GDF_FEED_URL }}
        run: |
          try { ./build-feed.ps1 -OutDir /tmp/out } catch { "BUILD THREW: $($_.Exception.GetType().FullName)" }
          if (Test-Path /tmp/out/last-run.json) { Get-Content /tmp/out/last-run.json -Raw }
